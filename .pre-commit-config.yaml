# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: check-shebang-scripts-are-executable
  - id: check-executables-have-shebangs
- repo: https://github.com/jumanjihouse/pre-commit-hooks
  rev: 3.0.0
  hooks:
  - id: shellcheck
  - id: shfmt
- repo: https://github.com/hadolint/hadolint
  rev: v2.12.1-beta
  hooks:
  - id: hadolint
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.39.0
  hooks:
  - id: markdownlint
  # dotenv-linter/dotenv-linter's own `language: docker` hook can't build --
  # its .dockerignore excludes its own Dockerfile from the build context, a
  # bug present since the hook manifest was first added (v4.0.0). Using
  # their published image directly instead avoids that build step entirely.
- repo: local
  hooks:
  - id: dotenv-linter
    name: dotenv-linter
    description: "Checks the style of Dotenv files."
    language: docker_image
    entry: dotenvlinter/dotenv-linter:4.0.0 check
    types: [text]
    files: '\.env*'
