name: Detect ibcontroller Releases

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

env:
  IBCONTROLLER_PACKAGE: py-ib-controller
  BRANCH_PREFIX: IBCONTROLLER-update
jobs:
  detect-release:
    name: Detect Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v7

      - name: Get Current Version
        id: version
        run: |
          CURRENT_IBCONTROLLER="$(grep 'ENV IBCONTROLLER_VERSION' Dockerfile.template|cut -d '=' -f 2)"
          echo "CURRENT_IBCONTROLLER=$CURRENT_IBCONTROLLER" >> $GITHUB_OUTPUT

      - name: Get ibcontroller latest version
        id: ibcontroller_version
        run: |
          IBCONTROLLER_LATEST="$(curl -sSL "https://pypi.org/pypi/${{ env.IBCONTROLLER_PACKAGE }}/json" | jq -r '.info.version')"
          echo "IBCONTROLLER_LATEST=$IBCONTROLLER_LATEST" >> $GITHUB_OUTPUT

      - name: Verify latest version
        id: verify_latest
        run: |
          current=${{ steps.version.outputs.CURRENT_IBCONTROLLER }}
          latest=${{ steps.ibcontroller_version.outputs.IBCONTROLLER_LATEST }}

          if [[ "$current" = "$latest" ]]; then
            update="false"
          else
            update="true"
          fi

          echo "update=$update" >> $GITHUB_OUTPUT

      - name: Check if branch already exists
        id: verify_branch
        if: ${{ steps.verify_latest.outputs.update == 'true' }}
        run: |
          latest=${{ steps.ibcontroller_version.outputs.IBCONTROLLER_LATEST }}
          prefix=${{ env.BRANCH_PREFIX }}
          search=${prefix}-${latest}

          if [ "$(git branch --list | grep ${search})" ]; then
            echo "BRANCH_EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "BRANCH_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: ${{ steps.verify_branch.outputs.BRANCH_EXISTS == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=${{ steps.version.outputs.CURRENT_IBCONTROLLER }}
          latest=${{ steps.ibcontroller_version.outputs.IBCONTROLLER_LATEST }}
          prefix=${{ env.BRANCH_PREFIX }}
          branch="${prefix}-${latest}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull
          git checkout -b "$branch" origin/master

          echo ".> updating Dockerfile.template"
          sed -i "s/IBCONTROLLER_VERSION=${ver}/IBCONTROLLER_VERSION=${latest}/g" Dockerfile.template

          git add Dockerfile.template
          git commit -m "Update ibcontroller from ${ver} to ${latest}"
          git push --set-upstream origin "$branch"

          gh pr create --base master --fill
