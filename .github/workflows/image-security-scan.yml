name: IB Gateway image security scan

on:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, latest]
        arch: [amd64, arm64]
    env:
      IMAGE: ghcr.io/gnzsnz/ib-gateway:${{ matrix.channel }}
      PLATFORM: linux/${{ matrix.arch }}
      TRIVY_VERSION: '0.76.2'
    steps:
      - name: Get cache week
        id: cache-week
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy databases
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/java-db
          key: trivy-db-${{ runner.os }}-${{ env.TRIVY_VERSION }}-${{ matrix.channel }}-${{ matrix.arch }}-${{ steps.cache-week.outputs.value }}
          restore-keys: |
            trivy-db-${{ runner.os }}-${{ env.TRIVY_VERSION }}-${{ matrix.channel }}-${{ matrix.arch }}-

      - name: Install Trivy
        env:
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}" \
            --output "$archive"
          echo "$TRIVY_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" trivy
          install -D trivy "$RUNNER_TEMP/bin/trivy"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan published image
        run: |
          trivy image --image-src remote --platform "$PLATFORM" --scanners vuln \
            --exit-code 0 --timeout 15m --format json --output trivy.json "$IMAGE"
          trivy convert --format sarif --severity HIGH,CRITICAL --output trivy.sarif trivy.json

      - name: Save scan reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-ib-gateway-${{ matrix.channel }}-${{ matrix.arch }}
          path: |
            trivy.json
            trivy.sarif
          if-no-files-found: error

  upload-sarif:
    needs: scan
    if: vars.TRIVY_UPLOAD_SARIF == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, latest]
        arch: [amd64, arm64]
    steps:
      - name: Check out source for code scanning
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          persist-credentials: false

      - name: Download scan report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-ib-gateway-${{ matrix.channel }}-${{ matrix.arch }}

      - name: Upload to GitHub code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-ib-gateway-${{ matrix.channel }}-${{ matrix.arch }}
          checkout_path: ${{ github.workspace }}/source
