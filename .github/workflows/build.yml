name: Docker Image Build - ibgateway/TWS build

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string

env:
  CHANNEL: ${{ inputs.channel }}

jobs:
  build:
    name: Build ibgateway & TWS

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      ###############################################################
      #   Build ibgateway
      ###############################################################
      - name: Docker metadata ibgateway
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/gnzsnz/ib-gateway
            gnzsnz/ib-gateway
          flavor: |
            latest=false
          tags: |
            type=match,pattern=v(\d+.\d+),group=1
            type=match,pattern=v(\d+.\d+.\w+),group=1
            type=match,pattern=v(\d+.\d+.\w+)+\-(stable|latest),group=2

      - name: Build ibgateway Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
          load: false
          platforms: linux/amd64,linux/arm64
          context: ./${{ env.CHANNEL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Dockerfile.tws's setup stage does `FROM ghcr.io/gnzsnz/ib-gateway:${IB_VERSION}` -- for
      # an in-progress version bump that tag doesn't exist in the registry yet, so the TWS build
      # below would otherwise always fail to pull it. Build ibgateway a second time, amd64-only
      # and loaded into the local image store under that exact ref, so the TWS build can be
      # redirected to it via build-contexts instead. amd64-only applies only to this local
      # handoff build and the TWS build below -- ibgateway's own multi-arch validation above is
      # unaffected, and TWS's real multi-arch build+push still happens in publish.yml once
      # ibgateway is actually published.
      - name: Get ib-gateway version for TWS build-context handoff
        id: ib_version
        run: |
          IB_VERSION="$(grep 'ARG IB_VERSION=' ${{ env.CHANNEL }}/Dockerfile.tws | cut -d '=' -f2)"
          echo "IB_VERSION=$IB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build local ibgateway image for TWS
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          platforms: linux/amd64
          context: ./${{ env.CHANNEL }}
          cache-from: type=gha
          tags: ghcr.io/gnzsnz/ib-gateway:${{ steps.ib_version.outputs.IB_VERSION }}

      ###############################################################
      #   Build tws
      ###############################################################
      - name: Docker metadata tws
        id: meta-tws
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/gnzsnz/tws-rdesktop
            gnzsnz/tws-rdesktop
          flavor: |
            latest=false
          tags: |
            type=match,pattern=v(\d+.\d+),group=1
            type=match,pattern=v(\d+.\d+.\w+),group=1
            type=match,pattern=v(\d+.\d+.\w+)+\-(stable|latest),group=2

      - name: Build TWS Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
          load: false
          platforms: linux/amd64
          context: ${{ env.CHANNEL }}
          file: ${{ env.CHANNEL }}/Dockerfile.tws
          build-contexts: |
            ghcr.io/gnzsnz/ib-gateway:${{ steps.ib_version.outputs.IB_VERSION }}=docker-image://ghcr.io/gnzsnz/ib-gateway:${{ steps.ib_version.outputs.IB_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta-tws.outputs.tags }}
          labels: ${{ steps.meta-tws.outputs.labels }}
