name: algo-trader
services:
  tws:
    restart: unless-stopped
    shm_size: "1gb" #recomended
    # GPU acceleration for TWS. Base image (rdesktop-xfce init-video) grants
    # the abc user access to whatever /dev/dri nodes are mapped in here, by
    # matching GID at container start -- remove this block entirely on a
    # host with no GPU (e.g. no /dev/dri at all), otherwise the container
    # fails to start.
    # devices:
    # - /dev/dri:/dev/dri #recomended, whole dir: card+render nodes, no fixed device number
    #- /dev/dri/renderD128:/dev/dri/renderD128 #narrower option (render node only), don't use both
    security_opt:
      - seccomp:unconfined # required
      - apparmor:unconfined # required
    build:
      context: ./latest
      dockerfile: Dockerfile
      target: tws
      tags:
        - "ghcr.io/gnzsnz/tws-rdesktop:latest"
      # uncomment to build ibcontroller from a git branch instead of its pinned PyPI
      # release -- for testing an unreleased fix, e.g. gitea ibcontroller#66
      args:
        IBCONTROLLER_SOURCE: ${IBCONTROLLER_SOURCE:-}
        IBCONTROLLER_GIT_REF: ${IBCONTROLLER_GIT_REF:-}
    image: ghcr.io/gnzsnz/tws-rdesktop:latest
    # ibcontroller settings (credentials included) live in ib.env, see README
    env_file:
      - ib.env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      RDP_PASSWORD: ${RDP_PASSWORD:-}
      RDP_PASSWORD_FILE: ${RDP_PASSWORD_FILE:-}
      IBC_TWS_SETTINGS_PATH: ${IBC_TWS_SETTINGS_PATH:-/config/tws_settings}
      # no env var for TWOFA_DEVICE/ALLOW_BLIND_TRADING/TWS_MASTER_CLIENT_ID/
      # BYPASS_WARNING/SAVE_TWS_SETTINGS -- use [[setting]]/[[dialog]] in ibcontroller.toml, see README
      TZ: ${TZ:-Etc/UTC}
      SSH_TUNNEL: ${SSH_TUNNEL:-}
      SSH_OPTIONS: ${SSH_OPTIONS:-}
      SSH_ALIVE_INTERVAL: ${SSH_ALIVE_INTERVAL:-}
      SSH_ALIVE_COUNT: ${SSH_ALIVE_COUNT:-}
      SSH_PASSPHRASE: ${SSH_PASSPHRASE:-}
      SSH_REMOTE_PORT: ${SSH_REMOTE_PORT:-}
      SSH_USER_TUNNEL: ${SSH_USER_TUNNEL:-}
      SSH_RESTART: ${SSH_RESTART:-}
      SSH_RDP_PORT: ${SSH_RDP_PORT:-}
      START_SCRIPTS: ${START_SCRIPTS:-}
      X_SCRIPTS: ${X_SCRIPTS:-}
      IBC_SCRIPTS: ${IBC_SCRIPTS:-}
    volumes:
      # config/log persistence, incl. XFCE/xrdp state; host dir must be owned by PUID:PGID
      - ./config:/config # optional
      - tws_tmp:/tmp # recommended for performance
      # agent sockets (IBC_APP_DIR/run): tmpfs, not the bind mount above, see README
      - type: tmpfs
        target: /config/ibcontroller/run
        tmpfs:
          mode: 0o1777 # -> decimal 1023 == octal 1777, /tmp-style perms
    ports:
      - "127.0.0.1:7496:7498" # live
      - "127.0.0.1:7497:7499" # paper
      - "127.0.0.1:3370:3389" # xrdp

volumes:
  tws_tmp:
