name: algo-trader
services:
  ib-gateway:
    restart: always
    stop_grace_period: 30s
    build:
      context: ./latest
      dockerfile: Dockerfile
      target: gateway
      tags:
        - "ghcr.io/gnzsnz/ib-gateway:latest"
      args:
        # the gateway user is baked in at build time, a runtime `user:` can't write its home
        USER_ID: ${PUID:-1000}
        USER_GID: ${PGID:-1000}
        # set to build ibcontroller from a git branch instead of its pinned PyPI
        # release -- for testing an unreleased fix, e.g. gitea ibcontroller#66
        IBCONTROLLER_SOURCE: ${IBCONTROLLER_SOURCE:-}
        IBCONTROLLER_GIT_REF: ${IBCONTROLLER_GIT_REF:-}
    image: ghcr.io/gnzsnz/ib-gateway:latest
    # ibcontroller settings (credentials included) live in ib.env, see README
    env_file:
      - ib.env
    environment:
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
      TZ: ${TZ:-Etc/UTC}
      SSH_TUNNEL: ${SSH_TUNNEL:-}
      SSH_OPTIONS: ${SSH_OPTIONS:-}
      SSH_ALIVE_INTERVAL: ${SSH_ALIVE_INTERVAL:-}
      SSH_ALIVE_COUNT: ${SSH_ALIVE_COUNT:-}
      SSH_PASSPHRASE: ${SSH_PASSPHRASE:-}
      SSH_REMOTE_PORT: ${SSH_REMOTE_PORT:-}
      SSH_USER_TUNNEL: ${SSH_USER_TUNNEL:-}
      SSH_RESTART: ${SSH_RESTART:-}
      SSH_VNC_PORT: ${SSH_VNC_PORT:-}
      START_SCRIPTS: ${START_SCRIPTS:-}
      X_SCRIPTS: ${X_SCRIPTS:-}
      IBC_SCRIPTS: ${IBC_SCRIPTS:-}
      IBC_TWS_SETTINGS_PATH: ${IBC_TWS_SETTINGS_PATH:-/home/ibgateway/tws_settings}
    volumes:
    #      - ${PWD}/jts.ini:/home/ibgateway/Jts/jts.ini
      # config/log persistence, see README; host dir must be owned by PUID:PGID
      - ${PWD}/ibcontroller/:/home/ibgateway/ibcontroller
      - ${PWD}/tws_settings/:${IBC_TWS_SETTINGS_PATH:-/home/ibgateway/tws_settings}
    #      - ${PWD}/ssh/:/home/ibgateway/.ssh
    #      - ${PWD}/scripts:/home/ibgateway/init-scripts
      # agent sockets (IBC_APP_DIR/run): tmpfs, not the bind mount above, see README
      - type: tmpfs
        target: /home/ibgateway/ibcontroller/run
        tmpfs:
          mode: 0o1777 # -> decimal 1023 == octal 1777, /tmp-style perms
    ports:
      - "127.0.0.1:4001:4003"
      - "127.0.0.1:4002:4004"
      - "127.0.0.1:5900:5900"
