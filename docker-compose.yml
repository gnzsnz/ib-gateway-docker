name: algo-trader
services:
  ib-gateway:
    restart: always
    build:
      context: ./latest
      dockerfile: Dockerfile
      target: gateway
      tags:
        - "ghcr.io/gnzsnz/ib-gateway:latest"
      # uncomment to build ibcontroller from a git branch instead of its pinned PyPI
      # release -- for testing an unreleased fix, e.g. gitea ibcontroller#66
      # args:
      #   IBCONTROLLER_SOURCE: git
      #   IBCONTROLLER_GIT_REF: feat/exit_codes
    image: ghcr.io/gnzsnz/ib-gateway:latest
    environment:
      # ibcontroller env vars, see README's "ibcontroller env vars and config volume"
      IBC_USERID: ${IBC_USERID}
      IBC_PASSWORD: ${IBC_PASSWORD}
      IBC_TRADING_MODE: ${IBC_TRADING_MODE:-paper}
      # image-only: paper process's own credentials when IBC_TRADING_MODE=both
      IBC_USERID_PAPER: ${IBC_USERID_PAPER:-}
      IBC_PASSWORD_PAPER: ${IBC_PASSWORD_PAPER:-}
      # bare key: "" != unset for ibcontroller, see README
      IBC_TWS_SETTINGS_PATH:
      IBC_ACCEPT_INCOMING_CONNECTIONS: ${IBC_ACCEPT_INCOMING_CONNECTIONS:-manual}
      IBC_READ_ONLY_API:
      IBC_MFA_TIMEOUT_ACTION: ${IBC_MFA_TIMEOUT_ACTION:-exit}
      IBC_AUTO_RESTART_TIME:
      IBC_AUTO_LOGOFF_TIME:
      # "HH:MM", weekly on Sunday -- direct rename of TWS_COLD_RESTART, same format
      IBC_COLD_RESTART_TIME:
      IBC_RELOGIN_AFTER_MFA_TIMEOUT: ${IBC_RELOGIN_AFTER_MFA_TIMEOUT:-no}
      IBC_MFA_EXIT_INTERVAL: ${IBC_MFA_EXIT_INTERVAL:-60}
      IBC_EXISTING_SESSION_ACTION: ${IBC_EXISTING_SESSION_ACTION:-primary}
      # no env var for TWOFA_DEVICE/ALLOW_BLIND_TRADING/TWS_MASTER_CLIENT_ID/
      # BYPASS_WARNING/SAVE_TWS_SETTINGS -- use ibkr_settings.toml, see README
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
      IBC_TIME_ZONE: ${IBC_TIME_ZONE:-Etc/UTC}
      TZ: ${IBC_TIME_ZONE:-Etc/UTC}
      CUSTOM_CONFIG: ${CUSTOM_CONFIG:-NO}
      # includes the unit, e.g. "1024m"/"4g"
      IBC_JAVA_HEAP_SIZE: ${IBC_JAVA_HEAP_SIZE:-}
      SSH_TUNNEL: ${SSH_TUNNEL:-}
      SSH_OPTIONS: ${SSH_OPTIONS:-}
      SSH_ALIVE_INTERVAL: ${SSH_ALIVE_INTERVAL:-}
      SSH_ALIVE_COUNT: ${SSH_ALIVE_COUNT:-}
      SSH_PASSPHRASE: ${SSH_PASSPHRASE:-}
      SSH_REMOTE_PORT: ${SSH_REMOTE_PORT:-}
      SSH_USER_TUNNEL: ${SSH_USER_TUNNEL:-}
      SSH_RESTART: ${SSH_RESTART:-}
      SSH_VNC_PORT: ${SSH_VNC_PORT:-}
      START_SCRIPTS: ${START_SCRIPTS:-}
      X_SCRIPTS: ${X_SCRIPTS:-}
      IBC_SCRIPTS: ${IBC_SCRIPTS:-}
    volumes:
    #      - ${PWD}/jts.ini:/home/ibgateway/Jts/jts.ini
      # config/log persistence, see README; host dir must be owned by USER_ID:USER_GID
      - ${PWD}/ibcontroller/:/home/ibgateway/ibcontroller
      - ${PWD}/tws_settings/:${IBC_TWS_SETTINGS_PATH:-/home/ibgateway/tws_settings}
    #      - ${PWD}/ssh/:/home/ibgateway/.ssh
    #      - ${PWD}/scripts:/home/ibgateway/init-scripts
      # agent sockets (IBC_APP_DIR/run): tmpfs, not the bind mount above, see README
      - type: tmpfs
        target: /home/ibgateway/ibcontroller/run
        tmpfs:
          mode: 0o1777 # -> decimal 1023 == octal 1777, /tmp-style perms
    ports:
      - "127.0.0.1:4001:4003"
      - "127.0.0.1:4002:4004"
      - "127.0.0.1:5900:5900"
